name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  push:
    tags:
      - '@mariomh8/storybook@*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: hexadrop/github-workflows/.github/workflows/check.yml@v1.11.0
    with:
      commands: '["lint:ci","test","typecheck","typecheck:astro"]'
      cache-commands: '["lint:ci"]'
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  release:
    name: Deploy
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: [ check ]
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: 'bun run build'

      - name: Configure Git User
        run: |
          git config --global user.email "github@mariomh.com"
          git config --global user.name "$GITHUB_ACTOR"

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy storybook/storybook-static --project-name=brand-mariomh
