name: Continuous integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    strategy:
      matrix:
        command: [ 'lint:ci', test, typecheck ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: ESLint cache
        uses: actions/cache@v4
        if: matrix.command == 'lint:ci'
        with:
          path: .eslintcache
          key: ${{ runner.os }}-node

      - name: ${{ matrix.command }}
        run: bun ${{ matrix.command }}

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs: [ check ]
    permissions:
      contents: 'write'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Authorize Google Cloud SDK
        id: auth
        uses: google-github-actions/auth@v3
        with:
          create_credentials_file: true
          project_id: ${{ secrets.GOOGLE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GOOGLE_PROJECT_WORKLOAD_IDENTITY_POOL_PROVIDER}}

      - name: Update .npmrc
        run: bunx google-artifactregistry-auth --credential-config .npmrc

      - name: Install dependencies
        run: bun install

      - name: Configure Git User
        run: |
          git config --global user.email "github@mariomh.com"
          git config --global user.name "$GITHUB_ACTOR"

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: bun changeset publish
          version: bun changeset version
          commit: 'chore: release'
          title: 'chore: release'
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
