name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

jobs:
  check:
    name: Check
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    uses: hexadrop/github-workflows/.github/workflows/check.yml@v1.8.0
    with:
      commands: '["lint:ci","typecheck","test","check:packages"]'
      cache-commands: '["lint:ci"]'
