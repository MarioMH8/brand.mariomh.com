name: "Release: prepare"

on:
  push:
    branches: [develop]

concurrency:
  group: release-prepare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check
    uses: hexadrop/github-workflows/.github/workflows/check.yml@v1.8.0
    with:
      commands: '["lint:ci","typecheck","test","check:packages"]'
      cache-commands: '["lint:ci"]'

  prepare:
    name: Prepare
    needs: [check]
    permissions:
      contents: write
      pull-requests: write
    uses: hexadrop/github-workflows/.github/workflows/release-prepare.yml@v1.8.0
    with:
      base-branch: main
      use-app-token: true
    secrets:
      app-private-key: ${{ secrets.HEXABOT_PRIVATE_KEY }}
